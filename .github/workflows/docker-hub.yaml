name: Build & Push Multi‑arch Docker Image

# Run when a new GitHub Release is published
on:
  release:
    types: [published]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      # Checkout source (Dockerfile, app code, etc.)
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up Docker Buildx (enables multi‑arch builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # Build and push for both amd64 and arm64
      - name: Build & push multi‑arch image
        run: |
          TAG=${{ github.event.release.tag_name }}
          REPO=${{ secrets.DOCKERHUB_USERNAME }}/caddy

          # Build for linux/amd64 and linux/arm64 and push in one step
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t $REPO:$TAG \
            -t $REPO:latest \
            --push \
            .
